# The Windows build: unit tests on Windows, then a self-contained app folder (PyInstaller, MSYS2 UCRT64),
# an installer (Inno Setup) and a portable zip, smoke-tested with MSYS2 moved away. The files end up as
# workflow artifacts; a release is made from them by hand.
name: Windows

on:
  push:
    branches: [windows]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SIPHON_AO: "null"  # tests and smoke tests never make a sound
  QJS_VERSION: v0.15.1
  QJS_SHA256: 5ea527b0405f0f3d11904c8722a4f1df9b631a4beed2bf988d0a831eb9f8e913

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: git make diffutils
          pacboy: >-
            python:p python-pip:p python-gobject:p gtk4:p libadwaita:p
            python-mutagen:p python-certifi:p python-requests:p python-websockets:p python-brotli:p
            python-pycryptodomex:p pyinstaller:p pyinstaller-hooks-contrib:p python-pytest:p
            gcc:p meson:p ninja:p pkgconf:p nasm:p libass:p lua51:p opus:p lame:p libvorbis:p

      - name: Python packages and QuickJS
        run: |
          python -m pip install --break-system-packages --no-warn-script-location "yt-dlp[default]" "mpv==1.0.8"
          mkdir -p build/tools
          curl -fsSL -o build/tools/qjs.exe "https://github.com/quickjs-ng/quickjs/releases/download/$QJS_VERSION/qjs-windows-x86_64.exe"
          echo "$QJS_SHA256  build/tools/qjs.exe" | sha256sum -c -
          echo "VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' siphon/__init__.py)" >> "$GITHUB_ENV"
          # The audio stack is rebuilt when its script or a library it links to changes. The GCC runtime is found by
          # its DLLs: MSYS2 split gcc-libs into libgcc, libstdc++ and others, and may rename them again.
          gccrt=$(pacman -Qqo /ucrt64/bin/libgcc_s_seh-1.dll /ucrt64/bin/libstdc++-6.dll | sort -u)
          libs=$(pacman -Q mingw-w64-ucrt-x86_64-{libass,lua51,opus,lame,libvorbis,zlib} $gccrt | sha256sum | cut -c1-12)
          echo "AV_KEY=av-$(sha256sum packaging/windows/build-av.sh | cut -c1-12)-$libs" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v6
        id: av
        with:
          path: build/av
          key: ${{ env.AV_KEY }}

      - name: Build ffmpeg and libmpv
        if: steps.av.outputs.cache-hit != 'true'
        run: packaging/windows/build-av.sh build/av build/av-src

      - uses: actions/cache/save@v6  # saved at once: a later failure must not throw away a 25-minute build
        if: steps.av.outputs.cache-hit != 'true'
        with:
          path: build/av
          key: ${{ env.AV_KEY }}

      - name: Unit tests
        timeout-minutes: 15
        shell: pwsh
        # MSYS2's Python in a plain Windows environment, as the packaged app runs (no MSYSTEM, so \ is the
        # separator), with the self-built ffmpeg and libmpv and QuickJS first on PATH.
        run: |
          Remove-Item Env:MSYSTEM  # setup-msys2 exports it to every step
          $env:PATH = "$PWD\build\av\bin;$PWD\build\tools;$env:RUNNER_TEMP\msys64\ucrt64\bin;$env:PATH"
          python -m pytest -q -p no:cacheprovider tests

      - name: Build the app folder
        run: |
          # GTK draws SVG icons itself; without the librsvg image loader, librsvg (13 MB) stays out of the bundle.
          rm -f "$MINGW_PREFIX"/lib/gdk-pixbuf-2.0/2.10.0/loaders/*svg*
          PATH="$PWD/build/av/bin:$PATH" pyinstaller --noconfirm --clean --log-level WARN \
            --distpath build/dist --workpath build/work packaging/windows/siphon.spec
          du -sh build/dist/Siphon
          du -a build/dist/Siphon/bin | sort -rn > build/sizes.txt
          head -25 build/sizes.txt

      - name: A downloaded engine for the smoke test
        run: |
          pip_version() { python -c "import importlib.metadata as m; print(m.version('$1'))"; }
          python -m pip download --no-deps --only-binary :all: -d build/engine \
            "yt-dlp==$(pip_version yt-dlp)" "yt-dlp-ejs==$(pip_version yt-dlp-ejs)"
          # A version above the bundled one, so Siphon loads these wheels instead of its own yt-dlp.
          python -c "import json, pathlib; d = pathlib.Path('build/engine'); (d / 'engine.json').write_text(json.dumps({'version': '2099.1.1', 'wheels': sorted(p.name for p in d.glob('*.whl'))}))"

      - name: Portable zip and installer
        shell: pwsh
        run: |
          $zip = "build\Siphon-$env:VERSION-Windows-portable.zip"
          7z a -tzip -mx=9 $zip .\build\dist\Siphon | Select-Object -Last 2
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Select-Object -Last 3
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName /Q "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\build\dist\Siphon" "/DOutputDir=$PWD\build" packaging\windows\siphon.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
          Get-ChildItem build\Siphon-* | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Smoke test without MSYS2
        timeout-minutes: 20  # about 3 when it passes; a hang (a download, an installer) ends here, not at the job's 60
        shell: pwsh
        run: |
          Remove-Item Env:MSYSTEM  # MSYS2's Python would use / as the path separator with it set
          Get-Process | Where-Object { $_.Path -like "$env:RUNNER_TEMP\msys64\*" } | Stop-Process -Force
          Rename-Item "$env:RUNNER_TEMP\msys64" msys64-away
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0;$PSHOME"
          packaging\windows\smoke.ps1 -Portable "build\Siphon-$env:VERSION-Windows-portable.zip" `
            -Setup "build\Siphon-$env:VERSION-Setup.exe" -Out build\smoke -Engine build\engine

      - name: Put MSYS2 back for the cache
        if: always()
        shell: pwsh
        run: if (Test-Path "$env:RUNNER_TEMP\msys64-away") { Rename-Item "$env:RUNNER_TEMP\msys64-away" msys64 }

      - uses: actions/upload-artifact@v7
        with:
          name: Siphon-${{ env.VERSION }}-Setup
          path: build/Siphon-${{ env.VERSION }}-Setup.exe
          compression-level: 0  # already compressed
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Siphon-${{ env.VERSION }}-Windows-portable
          path: build/Siphon-${{ env.VERSION }}-Windows-portable.zip
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()  # screenshots and logs, to see what went wrong
        with:
          name: smoke-test
          path: build/smoke
          if-no-files-found: ignore
